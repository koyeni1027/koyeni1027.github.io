<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carousel</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .carousel {
    width: 100%;
    max-width: 720px;
    aspect-ratio: 10 / 16;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background: #f5f5f5;
  }

  .carousel img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.2s ease-in-out;
  }

  .carousel img.active {
    opacity: 1;
  }

  .dots {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 2;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: background 0.3s ease, width 0.3s ease;
  }

  .dot.active {
    background: rgba(255, 255, 255, 0.95);
    width: 18px;
    border-radius: 3px;
  }

  @media (prefers-color-scheme: dark) {
    .carousel { background: #1a1a1a; }
  }
</style>
</head>
<body>
  <div class="carousel" id="carousel">
    <div class="dots" id="dots"></div>
  </div>

<script>
  // ============================================
  // EDIT THESE: Add your image URLs here
  // ============================================
  const images = [
    'https://i.pinimg.com/1200x/75/e9/cf/75e9cf80412d4c7ecc4124151a893edd.jpg',
    'https://i.pinimg.com/736x/87/3b/d0/873bd0f9677851d92848faa823054f28.jpg',
    'https://i.pinimg.com/736x/e7/6c/99/e76c992e943ab02646cab1abcde3b140.jpg'
  ];

  // How long each image stays visible (milliseconds)
  const ROTATION_INTERVAL = 6000;
  // ============================================

  const carousel = document.getElementById('carousel');
  const dotsContainer = document.getElementById('dots');

  const imgEls = images.map((src, i) => {
    const img = document.createElement('img');
    img.src = src;
    img.alt = '';
    if (i === 0) img.classList.add('active');
    carousel.insertBefore(img, dotsContainer);
    return img;
  });

  const dotEls = images.map((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', `Go to image ${i + 1}`);
    dot.addEventListener('click', () => goTo(i));
    dotsContainer.appendChild(dot);
    return dot;
  });

  let currentIndex = 0;
  let timer;

  function goTo(i) {
    imgEls[currentIndex].classList.remove('active');
    dotEls[currentIndex].classList.remove('active');
    currentIndex = i;
    imgEls[currentIndex].classList.add('active');
    dotEls[currentIndex].classList.add('active');
    resetTimer();
  }

  function next() {
    goTo((currentIndex + 1) % imgEls.length);
  }

  function resetTimer() {
    clearInterval(timer);
    if (imgEls.length > 1) {
      timer = setInterval(next, ROTATION_INTERVAL);
    }
  }

  resetTimer();
</script>
</body>
</html>
